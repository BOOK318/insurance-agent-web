version: '3.9'

services:
  # 本地PostgreSQL資料庫
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: insurance
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"

  # Next.js Web App
  app:
    image: ghcr.io/${GITHUB_USER}/insurance-agent-web:latest
    build: .
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://admin:${DB_PASSWORD}@db:5432/insurance
      JWT_SECRET: ${JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      NEXT_PUBLIC_APP_URL: https://${TUNNEL_DOMAIN}
      # Ollama runs on the Mac mini host (outside Docker)
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
    ports:
      - "3000:3000"

  # Cloudflare Tunnel（外網接入，唔需要VPN）
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

  # 自動update（你推新版本→所有Mac mini自動更新）
  watchtower:
    image: containrrr/watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 3600       # 每小時check一次
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "true"
    command: app                            # 只update app container

volumes:
  pgdata:
