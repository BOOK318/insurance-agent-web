    const titleTone = tone === "rose" ? "text-rose-700" : tone === "blue" ? "text-blue-700" : "text-slate-900";
    return (
      <button onClick={onClick} className="pressable w-full p-3.5 flex items-center gap-3 text-left">
        <div className={`w-9 h-9 rounded-xl flex items-center justify-center ${tones[tone]}`}><Icon name={icon} className="w-4 h-4" /></div>
        <div className="flex-1 min-w-0">
          <div className={`text-[13.5px] font-semibold truncate ${titleTone}`}>{title}</div>
          <div className="text-[11.5px] text-slate-500 truncate">{sub}</div>
        </div>
        <Icon name="chevR" className="w-4 h-4 text-slate-400" />
      </button>
    );
  }

  /* ----- Head Dashboard ----- */
  function HeadScreen({ go }) {
    return (
      <div className="absolute inset-0 screen-enter overflow-hidden">
        <div className="bg-slate-900 text-white pb-10">
          <StatusBar tone="light" />
          <div className="px-5 pt-1 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className="w-9 h-9 rounded-xl bg-amber-500/20 text-amber-300 ring-1 ring-amber-500/30 flex items-center justify-center"><Icon name="crown" /></div>
              <div>
                <div className="text-[11.5px] text-white/60">Team Lead 視圖</div>
                <div className="text-[18px] font-semibold leading-tight">Team 總覽</div>
              </div>
            </div>
            <button onClick={()=>go("dashboard")} className="text-[11.5px] text-white/80 bg-white/10 ring-1 ring-white/15 px-3 py-1.5 rounded-full">切換 Agent 視圖</button>
          </div>

          <div className="px-5 mt-5 grid grid-cols-3 gap-3">
            <Stat tone="dark" value="156" label="總客戶" sub="+8 本月" />
            <Stat tone="dark" value="284" label="有效保單" sub="+22 本月" />
            <Stat tone="dark" value="12"  label="待 Claim" sub="3 緊急" />
          </div>
        </div>

        <div className="px-4 -mt-6 pb-4 h-full overflow-y-auto noscroll">
          <div className="bg-white rounded-2xl card-shadow p-3">
            <div className="flex items-center justify-between px-1">
              <div className="text-[13.5px] font-semibold text-slate-900">Agent 表現</div>
              <button className="text-[11.5px] text-blue-700 font-medium">本月 ▾</button>
            </div>
            <div className="mt-2 grid grid-cols-12 text-[10.5px] uppercase tracking-wider text-slate-400 px-2 pb-1.5 border-b border-slate-100">
              <div className="col-span-5">Agent</div>
              <div className="col-span-2 text-right">客戶</div>
              <div className="col-span-2 text-right">保單</div>
              <div className="col-span-3 text-right">Claim</div>
            </div>
            <div className="divide-y divide-slate-100">
              {TEAM.map((t,i)=>(
                <div key={i} className={`grid grid-cols-12 items-center px-2 py-2.5 text-[13px] ${t.highlight?"bg-blue-50/40":""}`}>
                  <div className="col-span-5 flex items-center gap-2 min-w-0">
                    <div className={`w-7 h-7 rounded-full ${t.highlight?"bg-blue-600 text-white":"bg-slate-100 text-slate-700"} flex items-center justify-center text-[11px] font-semibold`}>
                      {t.name.split(" ").map(s=>s[0]).join("").slice(0,2).toUpperCase()}
                    </div>
                    <span className={`truncate ${t.highlight?"font-semibold text-slate-900":"text-slate-800"}`}>{t.name}</span>
                  </div>
                  <div className="col-span-2 text-right text-slate-700">👤 {t.clients}</div>
                  <div className="col-span-2 text-right text-slate-700">📋 {t.policies}</div>
                  <div className="col-span-3 text-right">
                    <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold ${t.alert?"bg-amber-100 text-amber-800":"bg-slate-100 text-slate-700"}`}>
                      🏥 {t.claims}
                    </span>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div className="mt-3 bg-amber-50 ring-1 ring-amber-200 rounded-2xl p-4">
            <div className="flex items-center gap-2">
              <span className="text-amber-700">⚠️</span>
              <div className="text-[13.5px] font-semibold text-amber-900">30日內到期保單</div>
              <span className="ml-auto text-[11px] text-amber-800/80">{EXPIRING.length} 份</span>
            </div>
            <div className="mt-2 divide-y divide-amber-200/70">
              {EXPIRING.map((x,i)=>(
                <div key={i} className="py-2 flex items-center gap-2 text-[12.5px]">
                  <div className="w-7 h-7 rounded-lg bg-amber-100 text-amber-800 flex items-center justify-center text-[11px] font-semibold">{x.days}d</div>
                  <div className="flex-1 min-w-0">
                    <div className="text-slate-900 font-medium truncate">{x.client}</div>
                    <div className="text-amber-900/70 truncate">{x.policy}</div>
                  </div>
                  <button className="text-[11.5px] font-semibold text-amber-900">指派 →</button>
                </div>
              ))}
            </div>
          </div>

          <div className="mt-3 bg-white rounded-2xl card-shadow p-4">
            <div className="text-[13.5px] font-semibold text-slate-900">本月團隊 GWP</div>
            <div className="mt-1 flex items-end gap-2">
              <div className="text-[28px] font-semibold tracking-tight text-slate-900 leading-none">HK$4.82M</div>
              <span className="text-[12px] font-semibold text-emerald-700">+18% MoM</span>
            </div>
            <div className="mt-3 h-20 flex items-end gap-1.5">
              {[34,42,30,55,48,62,71,58,66,74,80,92].map((v,i)=>(
                <div key={i} className="flex-1 rounded-md bg-blue-600/80" style={{ height: v+"%", opacity: 0.4 + i*0.05 }} />
              ))}
            </div>
            <div className="mt-1 flex justify-between text-[10px] text-slate-400">
              <span>1月</span><span>3月</span><span>6月</span><span>9月</span><span>12月</span>
            </div>
          </div>
        </div>
      </div>
    );
  }

  function Stat({ value, label, sub, tone }) {
    return (
      <div className="bg-white/5 ring-1 ring-white/10 rounded-2xl p-3">
        <div className="text-[24px] font-semibold tracking-tight leading-none">{value}</div>
        <div className="text-[11.5px] text-white/70 mt-1">{label}</div>
        <div className="text-[10.5px] text-emerald-300 mt-1">{sub}</div>
      </div>
    );
  }

  /* ----- Bottom nav ----- */
  function BottomNav({ active, go }) {
    const items = [
      { id: "dashboard", label: "主頁",   icon: "home"    },
      { id: "clients",   label: "客戶",   icon: "users"   },
      { id: "policies",  label: "保單",   icon: "shield"  },
      { id: "reminders", label: "提醒",   icon: "bell"    },
      { id: "ai",        label: "AI",     icon: "sparkle" },
    ];
    return (
      <div className="shrink-0 bg-white border-t border-slate-200 z-30">
        <div className="flex items-center px-1 pt-1">
          {items.map(it => {
            const isActive = active === it.id;
            return (
              <button key={it.id} onClick={()=>go(it.id)} className="pressable flex-1 py-2 flex flex-col items-center gap-0.5">
                <div className={`w-9 h-9 rounded-2xl flex items-center justify-center ${isActive?"bg-blue-700 text-white":"text-slate-500"}`}>
                  <Icon name={it.icon} className="w-[18px] h-[18px]" />
                </div>
                <div className={`text-[10.5px] ${isActive?"text-blue-700 font-semibold":"text-slate-500"}`}>{it.label}</div>
              </button>
            );
          })}
        </div>
        <div className="h-1.5 w-32 bg-black/80 rounded-full mx-auto my-1.5"></div>
      </div>
    );
  }

  /* ----- Policies (bonus, accessible via nav) ----- */
  function PoliciesScreen({ go }) {
    const all = CLIENTS.flatMap(c => c.policies.map(p => ({ ...p, client: c.nameZh, clientId: c.id })));
    return (
      <div className="absolute inset-0 screen-enter overflow-hidden">
        <div className="bg-white">
          <StatusBar tone="dark" />
          <div className="px-5 py-3">
            <div className="text-[20px] font-semibold tracking-tight text-slate-900">保單</div>
            <div className="text-[12px] text-slate-500">總共 {all.length} 份 · 1 份即將到期</div>
          </div>
          <div className="px-5 pb-3 flex gap-2 overflow-x-auto noscroll">
            {["全部","醫療","危疾","人壽","年金","到期"].map((t,i)=>(
              <button key={i} className={`pressable shrink-0 text-[12px] font-medium px-3 py-1.5 rounded-full ${i===0?"bg-slate-900 text-white":"bg-slate-100 text-slate-700"}`}>{t}</button>
            ))}
          </div>
        </div>
        <div className="h-px bg-slate-100" />
        <div className="px-4 py-3 pb-4 h-full overflow-y-auto noscroll bg-slate-50 space-y-2">
          {all.map((p,i)=>(
            <button key={i} onClick={()=>go("client", p.clientId)} className="pressable w-full text-left bg-white rounded-2xl p-3.5 card-shadow">
              <div className="flex items-center justify-between gap-2">
                <div className="min-w-0">
                  <div className="text-[14px] font-semibold text-slate-900 truncate">{p.name}</div>
                  <div className="text-[11.5px] text-slate-500 truncate">{p.client} · {p.company} · {p.number}</div>
                </div>
                {p.statusTone === "warn"
                  ? <Badge tone="warn">⚠️ {p.status}</Badge>
                  : <Badge tone="ok">{p.status}</Badge>}
              </div>
              <div className="mt-2 flex items-center justify-between text-[11.5px] text-slate-500">
                <span>保費 <span className="text-slate-800 font-medium">{p.premium}</span></span>
                <span>到期 <span className="text-slate-800 font-medium">{p.expiry}</span></span>
              </div>
            </button>
          ))}
        </div>
      </div>
    );
  }

  /* =========================================================
     APP / ROUTER
     ========================================================= */
  const SCREEN_LABELS = [
    { id: "login",     label: "登入",        ui: "login" },
    { id: "dashboard", label: "主頁",        ui: "dashboard" },
    { id: "clients",   label: "客戶列表",    ui: "clients" },
    { id: "client",    label: "客戶詳情",    ui: "clients", arg: "c1" },
    { id: "policies",  label: "保單",        ui: "policies" },
    { id: "ai",        label: "AI 助手",     ui: "ai" },
    { id: "reminders", label: "提醒",        ui: "reminders" },
    { id: "head",      label: "Team 主管",   ui: "head" },
  ];

  function App() {
    const [screen, setScreen] = useState("login");      // current rendered screen
    const [clientId, setClientId] = useState(null);
    const [aiContext, setAiContext] = useState(null);
    const [stack, setStack] = useState([]);             // simple back stack

    function go(target, arg) {
      setStack(s => screen ? [...s, { screen, clientId, aiContext }] : s);
      if (target === "client") { setClientId(arg || "c1"); }
      if (target === "ai")     { setAiContext(arg || null); }
      setScreen(target);
    }

    function back() {
      setStack(s => {
        if (s.length === 0) { setScreen("dashboard"); return s; }
        const prev = s[s.length - 1];
        setScreen(prev.screen);
        setClientId(prev.clientId);
        setAiContext(prev.aiContext);
        return s.slice(0, -1);
      });
    }

    function jump(target) {
      // Jump from demo tabs — reset stack to that screen
      setStack([]);
      if (target === "client") setClientId("c1");
      setScreen(target);
    }

    const showsBottomNav = ["dashboard","clients","policies","reminders"].includes(screen);
    const navActive = ["dashboard","clients","policies","ai","reminders"].includes(screen) ? screen : null;

    return (
      <div className="min-h-screen flex flex-col items-center pt-6 pb-12 px-4">
        {/* Demo tab strip */}
        <div className="w-full max-w-[860px] mb-5">
          <div className="flex items-center justify-between mb-2">
            <div>
              <div className="text-[11px] tracking-[0.18em] uppercase text-slate-500 font-semibold">Prototype · InsuranceAI</div>
              <div className="text-[15px] text-slate-900 font-semibold">CRM 助手 — Hong Kong agents</div>
            </div>
            <div className="text-[11px] text-slate-500">Demo navigation — click any screen</div>
          </div>
          <div className="bg-white/70 backdrop-blur ring-1 ring-slate-200 rounded-2xl p-1 flex flex-wrap gap-1">
            {SCREEN_LABELS.map(s => {
              const active = (s.id === "client" && screen === "client") || (s.id !== "client" && screen === s.id);
              return (
                <button key={s.id}
                  onClick={()=>jump(s.id)}
                  className={`demo-tab pressable text-[12px] font-medium px-3 py-1.5 rounded-xl ${active?"active":"text-slate-700 hover:bg-slate-100"}`}>
                  {s.label}
                </button>
              );
            })}
          </div>
        </div>

        {/* Phone */}
        <div className="phone-bezel relative">
          <div className="phone-screen">
            <div className="notch"></div>

            <div className="screen-frame">
              {screen === "login"     && <LoginScreen go={go} />}
              {screen === "dashboard" && <Dashboard go={go} />}
              {screen === "clients"   && <ClientsScreen go={go} />}
              {screen === "client"    && <ClientDetail go={go} clientId={clientId} back={back} />}
              {screen === "policies"  && <PoliciesScreen go={go} />}
              {screen === "ai"        && <AIScreen contextId={aiContext} back={()=>{ setStack([]); setScreen("dashboard"); }} />}
              {screen === "reminders" && <RemindersScreen go={go} />}
              {screen === "head"      && <HeadScreen go={go} />}
            </div>

            {showsBottomNav && <BottomNav active={navActive} go={jump} />}
          </div>
        </div>

        <div className="text-[11px] text-slate-500 mt-4">
          Tip: navigate via the tabs above, the bottom nav, or in-screen buttons. Back arrow on detail screens.
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
